<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: "Times New Roman", Times, serif; margin: 0; padding: 10px; background-color: white; }
        .text { font-size: 13px; margin-bottom: 2px; }
        .row { display: flex; align-items: flex-start; gap: 4px; }
        #captcha-box { background: black; color: white; padding: 1px 12px; font-size: 12px; font-family: monospace; font-weight: bold; border: 1px solid black; }
        input { border: 1px solid black; height: 16px; width: 180px; padding: 1px; font-size: 13px; }
        button { display: block; margin-top: 4px; margin-left: 65px; font-size: 11px; padding: 1px 4px; background: #efefef; border: 0.5px solid #767676; cursor: pointer; }
    </style>
</head>
<body>
    <div class="text">Enter code and verify.</div>
    <div class="row">
        <div id="captcha-box"></div>
        <input type="text" id="user-input">
    </div>
    <button onclick="checkVerify()">Verify QR</button>

    <script>
        const chars = "0123456789abcdefghijklmnopqrstuvwxyz";
        let code = "";
        for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('captcha-box').innerText = code;

        function checkVerify() {
            if (document.getElementById('user-input').value.toLowerCase() === code) {
                window.location.href = "details.html";
            } else {
                alert("Wrong code!");
                location.reload();
            }
        }
    </script>
</body>
</html>
